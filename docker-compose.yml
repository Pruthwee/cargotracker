version: '3.8'

services:
  cargotracker:
    build: .
    image: cargotracker:latest
    ports:
      - "8080:8080"
    environment:
      DB_DRIVER_CLASS: ${DB_DRIVER_CLASS:-org.postgresql.ds.PGPoolingDataSource}
      DB_JDBC_URL: ${DB_JDBC_URL:-jdbc:postgresql://localhost:5432/postgres}
      DB_USER: ${DB_USER:-cargotracker}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      GRAPH_TRAVERSAL_URL: ${GRAPH_TRAVERSAL_URL:-http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path}
      PROJECT_STAGE: ${PROJECT_STAGE:-Production}
