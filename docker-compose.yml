version: "3.8"

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POSTGRESQL_JDBC_URL: ${POSTGRESQL_JDBC_URL:-jdbc:postgresql://host.docker.internal:5432/postgres}
        POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-postgres}
        POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-postgres}
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      TZ: UTC
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
      POSTGRESQL_JDBC_URL: ${POSTGRESQL_JDBC_URL:-jdbc:postgresql://host.docker.internal:5432/postgres}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-postgres}
    volumes:
      - ./config:/app/config:ro
      - cargo-tracker-data:/app/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  cargo-tracker-data:
