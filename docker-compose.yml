version: '3.8'
services:
  cargo-tracker:
    image: cargo-tracker:latest
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_JDBC_URL=${DB_JDBC_URL:-jdbc:h2:file:./cargo-tracker-data/cargo-tracker-database}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - TZ=UTC
    volumes:
      - ./config:/app/config
      - cargo-tracker-data:/app/cargo-tracker-data

volumes:
  cargo-tracker-data:
