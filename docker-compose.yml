version: '3.8'
services:
  cargotracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargotracker:latest
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=docker
      - DB_JDBC_URL=jdbc:postgresql://postgres-db:5432/cargotracker
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    volumes:
      - ./config:/app/config
    restart: always
