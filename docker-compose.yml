version: '3.8'
services:
  cargo-tracker:
    image: cargo-tracker:latest
    ports:
      - "8080:8080"
    environment:
      - DB_JDBC_URL=${DB_JDBC_URL:-jdbc:h2:file:./cargo-tracker-data/cargo-tracker-database}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./config:/app/config
      - ./cargo-tracker-data:/app/cargo-tracker-data
