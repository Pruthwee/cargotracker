version: "3.8"

services:
  cargo-tracker:
    image: cargo-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cargo-tracker
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - TZ=UTC
      - POSTGRES_JDBC_URL=${POSTGRES_JDBC_URL:-jdbc:postgresql://db-host:5432/cargotracker}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - GRAPH_TRAVERSAL_URL=${GRAPH_TRAVERSAL_URL:-http://localhost:8080/rest/graph-traversal/shortest-path}
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
