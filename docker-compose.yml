version: '3.8'
services:
  cargo-tracker:
    image: cargo-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_JDBC_URL=${DB_JDBC_URL:-jdbc:postgresql://postgres-db:5432/cargotracker}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - TZ=UTC
    volumes:
      - ./config:/app/config
    restart: always
