version: '3.8'

services:
  cargo-tracker:
    image: cargo-tracker:latest
    ports:
      - "8080:8080"
    environment:
      DB_DRIVER_CLASS: "org.postgresql.ds.PGPoolingDataSource"
      DB_JDBC_URL: "jdbc:postgresql://postgres:5432/postgres"
      DB_USER: "cargotracker"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
      GRAPH_TRAVERSAL_URL: "http://localhost:8080/rest/graph-traversal/shortest-path"
    volumes:
      - cargo-tracker-data:/cargo-tracker-data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

volumes:
  cargo-tracker-data:
