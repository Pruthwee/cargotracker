version: '3.8'

services:
  cargo-tracker:
    build: .
    image: cargo-tracker:latest
    ports:
      - "8080:8080"
    environment:
      DB_DRIVER_CLASS: ${DB_DRIVER_CLASS:-org.postgresql.ds.PGPoolingDataSource}
      DB_JDBC_URL: ${DB_JDBC_URL:?set DB_JDBC_URL}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      GRAPH_TRAVERSAL_URL: ${GRAPH_TRAVERSAL_URL:-http://localhost:8080/rest/graph-traversal/shortest-path}
    volumes:
      - cargo-tracker-data:/home/appuser/cargo-tracker-data
