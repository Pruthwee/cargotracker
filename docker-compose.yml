version: '3.8'

services:
  cargo-tracker:
    build: .
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:?set DB_URL}
      - DB_USER=${DB_USER:?set DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - GRAPH_TRAVERSAL_URL=${GRAPH_TRAVERSAL_URL:-http://localhost:8080/rest/graph-traversal/shortest-path}
    volumes:
      - cargo-tracker-data:/opt/cargo-tracker/data

volumes:
  cargo-tracker-data:
