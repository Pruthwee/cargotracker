version: '3.8'

services:
  cargo-tracker:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_DRIVER_CLASS: ${DB_DRIVER_CLASS:-org.postgresql.ds.PGPoolingDataSource}
      DB_JDBC_URL: ${DB_JDBC_URL:-jdbc:postgresql://postgres:5432/postgres}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      GRAPH_TRAVERSAL_URL: ${GRAPH_TRAVERSAL_URL:-http://localhost:8080/rest/graph-traversal/shortest-path}
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    volumes:
      - cargo-tracker-data:/cargo-tracker-data
volumes:
  cargo-tracker-data:
