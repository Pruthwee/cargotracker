version: "3.9"

services:
  cargo-tracker:
    image: cargo-tracker:latest
    container_name: cargo-tracker
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8181:8181"
    environment:
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - GRAPH_TRAVERSAL_URL=http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path
      - DB_JDBC_URL=jdbc:h2:file:./cargo-tracker-data/cargo-tracker-database
      - DB_USER=
      - DB_PASSWORD=
    volumes:
      - cargo-tracker-data:/opt/payara/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "java -version 2>&1 | grep -q 'version' && echo 'ok'"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
