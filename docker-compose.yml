version: '3.8'
services:
  cargotracker:
    image: cargotracker:latest
    ports:
      - "8080:8080"
    environment:
      - POSTGRESQL_JDBC_URL=jdbc:postgresql://postgres-db:5432/cargotracker
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres
      - TZ=UTC
    volumes:
      - ./config:/app/config
    restart: always
