# Runs the application's own container. The PostgreSQL database is external: point DB_JDBC_URL
# at it. Credentials come from the environment of the shell that runs compose:
#
#   export DB_USER=... DB_PASSWORD=...
#   export DB_JDBC_URL=jdbc:postgresql://host.docker.internal:5432/postgres
#   docker compose up --build
#
name: cargotrackerm-mono

services:
  cargotrackerm-mono:
    image: cargotrackerm-mono:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_JDBC_URL: ${DB_JDBC_URL:?set DB_JDBC_URL}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC}
      TZ: UTC
    volumes:
      # Payara Micro unpacks the application and writes its runtime files here
      - payara-runtime:/tmp
    restart: unless-stopped

volumes:
  payara-runtime:
