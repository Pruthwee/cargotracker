# To run locally, first build the Docker image:
#
#  docker build -f Dockerfile -t cargotracker .
#
# Then start the application with:
#
#  docker-compose up
#
# The application connects to external services (database, message broker) via
# environment variables. Set them in your shell before running docker-compose:
#
#  export DB_HOST=localhost
#  export DB_PORT=5432
#  export DB_USER=cargotracker
#  export DB_PASSWORD=cargotracker
#  export DB_URL=jdbc:postgresql://localhost:5432/cargotracker
#  export GRAPH_TRAVERSAL_URL=http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path
#
version: '3.8'

services:
  cargotracker:
    image: cargotracker
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-cargotracker}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_URL: ${DB_URL:-jdbc:postgresql://localhost:5432/cargotracker}
      GRAPH_TRAVERSAL_URL: ${GRAPH_TRAVERSAL_URL:-http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path}
    volumes:
      - cargotracker-data:/cargo-tracker-data

volumes:
  cargotracker-data:
