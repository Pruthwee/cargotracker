# AWS S3 configuration for file storage replacement
APP_S3_BUCKET=${APP_S3_BUCKET}
APP_S3_PREFIX_UPLOAD=upload/
APP_S3_PREFIX_ARCHIVE=archive/
APP_S3_PREFIX_FAILED=failed/

# AWS SQS configuration for messaging replacement of JMS
APP_SQS_QUEUE_URL=${APP_SQS_QUEUE_URL}

# Safe logging: prevent SDK wire and request logs from leaking secrets
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
