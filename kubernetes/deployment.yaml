apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: "3.1-SNAPSHOT"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: "3.1-SNAPSHOT"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: cargo-tracker
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8181
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions"
            - name: GRAPH_TRAVERSAL_URL
              value: "{{GRAPH_TRAVERSAL_URL}}"
            - name: DB_JDBC_URL
              value: "{{DB_JDBC_URL}}"
            - name: DB_USER
              value: "{{DB_USER}}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cargo-tracker-secrets
                  key: db-password
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: cargo-tracker-data
              mountPath: /opt/payara/data
      volumes:
        - name: cargo-tracker-data
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
