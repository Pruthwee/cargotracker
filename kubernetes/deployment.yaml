apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargotrackerm-mono
  namespace: cargotrackerm-mono
  labels:
    app: cargotrackerm-mono
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargotrackerm-mono
  template:
    metadata:
      labels:
        app: cargotrackerm-mono
    spec:
      containers:
        - name: cargotrackerm-mono
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DB_JDBC_URL
              value: "{{DB_JDBC_URL}}"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cargotrackerm-mono-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cargotrackerm-mono-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
