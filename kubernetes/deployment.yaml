apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: "{{NAMESPACE}}"
  labels:
    app: cargo-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
    spec:
      containers:
        - name: cargo-tracker
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: TZ
              value: "UTC"
            - name: JAVA_TOOL_OPTIONS
              value: "-Dfile.encoding=UTF-8 -Duser.timezone=UTC"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: cargo-tracker-secrets
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cargo-tracker-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cargo-tracker-secrets
                  key: db-password
            - name: GRAPH_TRAVERSAL_URL
              value: "{{GRAPH_TRAVERSAL_URL}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      imagePullSecrets:
        - name: ecr-cred
