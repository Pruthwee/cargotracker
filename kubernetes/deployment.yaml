apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargotracker
  namespace: cargotracker
  labels:
    app: cargotracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargotracker
  template:
    metadata:
      labels:
        app: cargotracker
    spec:
      containers:
        - name: cargotracker
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRESQL_JDBC_URL
              value: "{{POSTGRESQL_JDBC_URL}}"
            - name: POSTGRESQL_USERNAME
              value: "{{POSTGRESQL_USERNAME}}"
            - name: POSTGRESQL_PASSWORD
              value: "{{POSTGRESQL_PASSWORD}}"
            - name: TZ
              value: "UTC"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
