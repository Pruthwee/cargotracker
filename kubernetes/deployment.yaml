apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: "3.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: "3.1"
    spec:
      containers:
        - name: cargo-tracker
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions"
            - name: DB_JDBC_URL
              value: "{{DB_JDBC_URL}}"
            - name: DB_USER
              value: "{{DB_USER}}"
            - name: DB_PASSWORD
              value: "{{DB_PASSWORD}}"
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: GRAPH_TRAVERSAL_URL
              value: "{{GRAPH_TRAVERSAL_URL}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /rest/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
