apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: "3.1"
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: "3.1"
        component: web
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: cargo-tracker
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8081
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: POSTGRES_JDBC_URL
              value: "{{POSTGRES_JDBC_URL}}"
            - name: POSTGRES_USERNAME
              value: "{{POSTGRES_USERNAME}}"
            - name: POSTGRES_PASSWORD
              value: "{{POSTGRES_PASSWORD}}"
            - name: GRAPH_TRAVERSAL_URL
              value: "{{GRAPH_TRAVERSAL_URL}}"
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: cargo-tracker-data
              mountPath: /opt/payara/cargo-tracker-data
      volumes:
        - name: cargo-tracker-data
          emptyDir: {}
      terminationGracePeriodSeconds: 60
