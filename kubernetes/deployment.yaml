apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargotracker
  namespace: cargotracker
  labels:
    app: cargotracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargotracker
  template:
    metadata:
      labels:
        app: cargotracker
    spec:
      containers:
        - name: cargotracker
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport"
            - name: DB_JDBC_URL
              value: "{{DB_JDBC_URL}}"
            - name: DB_USER
              value: "{{DB_USER}}"
            - name: DB_PASSWORD
              value: "{{DB_PASSWORD}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
