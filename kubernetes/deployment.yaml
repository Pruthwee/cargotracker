apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    app.kubernetes.io/name: cargo-tracker
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: cargo-tracker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cargo-tracker
        app.kubernetes.io/name: cargo-tracker
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
      containers:
        - name: cargo-tracker
          image: "{{IMAGE_URI}}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
            - name: PAYARA_ARGS
              value: "--nocluster --nohazelcast --port 8080"
            - name: POSTGRESQL_JDBC_URL
              value: "{{POSTGRESQL_JDBC_URL}}"
            - name: POSTGRESQL_USERNAME
              value: "{{POSTGRESQL_USERNAME}}"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cargo-tracker-secrets
                  key: postgresql-password
                  optional: true
            - name: GRAPH_TRAVERSAL_URL
              value: "{{GRAPH_TRAVERSAL_URL}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /rest/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /rest/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /rest/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
