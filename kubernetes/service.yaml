apiVersion: v1
kind: Service
metadata:
  name: cargo-tracker-service
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8081
      protocol: TCP
  selector:
    app: cargo-tracker
